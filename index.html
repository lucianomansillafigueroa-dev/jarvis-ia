
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b14">
<title>SUSAN AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#050b14;
 color:#eaf6ff;
 font-family:Arial,sans-serif;
 min-height:100vh;
}
header{
 text-align:center;
 padding:25px 15px 15px;
 border-bottom:1px solid #12334b;
}
.logo{
 font-size:35px;
 font-weight:bold;
 letter-spacing:5px;
 color:#40cfff;
 text-shadow:0 0 18px #008cff;
}
.subtitle{color:#7298b4;font-size:12px;margin-top:7px}
.status{color:#42e6a4;font-size:12px;margin-top:12px}
main{max-width:750px;margin:auto;padding:15px}
#chat{
 height:55vh;
 min-height:300px;
 overflow-y:auto;
 padding:12px;
 background:#081522;
 border:1px solid #12334b;
 border-radius:14px;
}
.message{
 padding:12px 14px;
 margin:10px 0;
 border-radius:12px;
 line-height:1.5;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.bot{
 background:#10283b;
 border-left:3px solid #32c8ff;
 margin-right:25px;
}
.user{
 background:#123b54;
 border-right:3px solid #32c8ff;
 margin-left:25px;
 text-align:right;
}
.controls{display:flex;gap:8px;margin-top:12px}
input{
 flex:1;
 min-width:0;
 padding:14px;
 background:#0c1e2d;
 color:white;
 border:1px solid #1c5474;
 border-radius:10px;
 outline:none;
 font-size:15px;
}
button{
 background:#087eae;
 color:white;
 border:0;
 padding:12px 15px;
 border-radius:10px;
 font-weight:bold;
 cursor:pointer;
}
button:active{opacity:.7}
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:12px;
}
.actions button{background:#102c40;border:1px solid #1c5474}
footer{text-align:center;color:#55758d;font-size:11px;padding:20px}
</style>
</head>

<body>
<header>
 <div class="logo">SUSAN AI</div>
 <div class="subtitle">SISTEMA DE ASISTENCIA Y CONOCIMIENTO</div>
 <div class="status">● SISTEMA EN LÍNEA</div>
</header>

<main>
 <div id="chat">
  <div class="message bot">
   Hola. Soy SUSAN, tu asistente personal.<br>
   ¿En qué puedo ayudarte?
  </div>
 </div>

 <div class="controls">
  <input id="question" type="text" placeholder="Escribí tu pregunta..."
   autocomplete="off">
  <button onclick="sendMessage()">ENVIAR</button>
 </div>

 <div class="actions">
  <button onclick="teach()">ENSEÑAR</button>
  <button onclick="speakLast()">🔊 VOZ</button>
  <button onclick="clearChat()">LIMPIAR</button>
 </div>
</main>

<footer>SUSAN AI 6.0 · ASISTENTE PERSONAL</footer>

<script>
// ==================================
// 1. ELEMENTOS DE LA INTERFAZ
// ==================================

const chat = document.getElementById("chat");
const question = document.getElementById("question");

let lastAnswer = "";

// ==================================
// 2. BASE DE CONOCIMIENTOS
// ==================================

const knowledge = {
 "hola": "Hola. ¿En qué puedo ayudarte?",
 "buenos dias": "¡Buenos días! Estoy lista para ayudarte.",
 "buenas tardes": "¡Buenas tardes! ¿Qué necesitás?",
 "buenas noches": "¡Buenas noches! ¿En qué puedo ayudarte?",
 "como estas": "Estoy funcionando correctamente. Gracias por preguntar.",
 "quien sos": "Soy SUSAN AI, un asistente personal creado para responder preguntas y aprender nuevos conocimientos.",
 "quien te creo": "Fui creada por Luciano.",
 "que podes hacer": "Puedo responder preguntas de cultura general, resolver cálculos, buscar información en mi base de conocimientos y aprender respuestas nuevas.",
 "que es la inteligencia artificial": "La inteligencia artificial es una tecnología que permite que los sistemas informáticos realicen tareas que normalmente requieren capacidades humanas, como reconocer patrones, procesar lenguaje y resolver problemas.",
 "que es un atomo": "Un átomo es la unidad básica de la materia. Está formado por protones, neutrones y electrones.",
 "que es la gravedad": "La gravedad es una fuerza de atracción entre los cuerpos que tienen masa.",
 "que es la fotosintesis": "La fotosíntesis es el proceso por el cual las plantas utilizan la luz solar, el agua y el dióxido de carbono para producir alimento y liberar oxígeno.",
 "que es el adn": "El ADN es la molécula que contiene la información genética de los seres vivos.",
 "capital de argentina": "La capital de Argentina es Buenos Aires.",
 "capital de alemania": "La capital de Alemania es Berlín.",
 "capital de francia": "La capital de Francia es París.",
 "capital de españa": "La capital de España es Madrid.",
 "capital de italia": "La capital de Italia es Roma.",
 "capital de brasil": "La capital de Brasil es Brasilia.",
 "capital de chile": "La capital de Chile es Santiago.",
 "capital de uruguay": "La capital de Uruguay es Montevideo.",
 "capital de paraguay": "La capital de Paraguay es Asunción.",
 "capital de japon": "La capital de Japón es Tokio.",
 "capital de china": "La capital de China es Pekín.",
 "capital de rusia": "La capital de Rusia es Moscú.",
 "capital de reino unido": "La capital del Reino Unido es Londres.",
 "capital de estados unidos": "La capital de Estados Unidos es Washington D. C.",
 "capital de mexico": "La capital de México es Ciudad de México.",
 "capital de canada": "La capital de Canadá es Ottawa.",
 "capital de australia": "La capital de Australia es Canberra.",
 "capital de portugal": "La capital de Portugal es Lisboa.",
 "capital de colombia": "La capital de Colombia es Bogotá.",
 "capital de peru": "La capital de Perú es Lima.",
 "capital de bolivia": "La capital de Bolivia es Sucre. La sede del gobierno está en La Paz.",
 "capital de egipto": "La capital de Egipto es El Cairo.",
 "capital de india": "La capital de India es Nueva Delhi.",
 "capital de corea del sur": "La capital de Corea del Sur es Seúl.",
 "capital de noruega": "La capital de Noruega es Oslo.",
 "capital de suecia": "La capital de Suecia es Estocolmo.",
 "capital de grecia": "La capital de Grecia es Atenas.",
 "capital de turquia": "La capital de Turquía es Ankara.",
 "capital de suiza": "La capital de Suiza es Berna."
};

// ==================================
// 3. TABLA PERIÓDICA
// ==================================

const elements = [
["Hidrógeno","H"],["Helio","He"],["Litio","Li"],["Berilio","Be"],
["Boro","B"],["Carbono","C"],["Nitrógeno","N"],["Oxígeno","O"],
["Flúor","F"],["Neón","Ne"],["Sodio","Na"],["Magnesio","Mg"],
["Aluminio","Al"],["Silicio","Si"],["Fósforo","P"],["Azufre","S"],
["Cloro","Cl"],["Argón","Ar"],["Potasio","K"],["Calcio","Ca"],
["Escandio","Sc"],["Titanio","Ti"],["Vanadio","V"],["Cromo","Cr"],
["Manganeso","Mn"],["Hierro","Fe"],["Cobalto","Co"],["Níquel","Ni"],
["Cobre","Cu"],["Zinc","Zn"],["Galio","Ga"],["Germanio","Ge"],
["Arsénico","As"],["Selenio","Se"],["Bromo","Br"],["Kriptón","Kr"],
["Rubidio","Rb"],["Estroncio","Sr"],["Itrio","Y"],["Circonio","Zr"],
["Niobio","Nb"],["Molibdeno","Mo"],["Tecnecio","Tc"],["Rutenio","Ru"],
["Rodio","Rh"],["Paladio","Pd"],["Plata","Ag"],["Cadmio","Cd"],
["Indio","In"],["Estaño","Sn"],["Antimonio","Sb"],["Telurio","Te"],
["Yodo","I"],["Xenón","Xe"],["Cesio","Cs"],["Bario","Ba"],
["Lantano","La"],["Cerio","Ce"],["Praseodimio","Pr"],["Neodimio","Nd"],
["Prometio","Pm"],["Samario","Sm"],["Europio","Eu"],["Gadolinio","Gd"],
["Terbio","Tb"],["Disprosio","Dy"],["Holmio","Ho"],["Erbio","Er"],
["Tulio","Tm"],["Iterbio","Yb"],["Lutecio","Lu"],["Hafnio","Hf"],
["Tantalio","Ta"],["Wolframio","W"],["Renio","Re"],["Osmio","Os"],
["Iridio","Ir"],["Platino","Pt"],["Oro","Au"],["Mercurio","Hg"],
["Talio","Tl"],["Plomo","Pb"],["Bismuto","Bi"],["Polonio","Po"],
["Astato","At"],["Radón","Rn"],["Francio","Fr"],["Radio","Ra"],
["Actinio","Ac"],["Torio","Th"],["Protactinio","Pa"],["Uranio","U"],
["Neptunio","Np"],["Plutonio","Pu"],["Americio","Am"],["Curio","Cm"],
["Berkelio","Bk"],["Californio","Cf"],["Einsteinio","Es"],["Fermio","Fm"],
["Mendelevio","Md"],["Nobelio","No"],["Lawrencio","Lr"],["Rutherfordio","Rf"],
["Dubnio","Db"],["Seaborgio","Sg"],["Bohrio","Bh"],["Hassio","Hs"],
["Meitnerio","Mt"],["Darmstadtio","Ds"],["Roentgenio","Rg"],["Copernicio","Cn"],
["Nihonio","Nh"],["Flerovio","Fl"],["Moscovio","Mc"],["Livermorio","Lv"],
["Teneso","Ts"],["Oganesón","Og"]
];

function findElement(query){
 const q = normalize(query);
 for(let i=0;i<elements.length;i++){
  const name=normalize(elements[i][0]);
  const symbol=normalize(elements[i][1]);
  if(q===name || q===symbol || q===String(i+1)){
   return {
    name:elements[i][0],
    symbol:elements[i][1],
    number:i+1
   };
  }
 }
 return null;
}

// ==================================
// 4. NORMALIZAR TEXTO
// ==================================

function normalize(text){
 return String(text)
  .toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[¿?¡!,.;:]/g,"")
  .trim();
}

// ==================================
// 5. CALCULADORA
// ==================================

function calculate(expression){
 let exp=expression
  .replace(/x/gi,"*")
  .replace(/÷/g,"/")
  .replace(/,/g,".");

 if(!/^[0-9+\-*/().%\s^]+$/.test(exp)){
  return null;
 }

 exp=exp.replace(/\^/g,"**");

 try{
  const result=Function('"use strict";return ('+exp+')')();
  if(typeof result!=="number" || !Number.isFinite(result)){
   return "No se puede resolver esa operación.";
  }
  return Number.isInteger(result)?result:Number(result.toFixed(8));
 }catch(error){
  return null;
 }
}

// ==================================
// 6. MEMORIA PERSONAL
// ==================================

function getMemory(){
 try{
  return JSON.parse(localStorage.getItem("susanKnowledge")||"{}");
 }catch(error){
  return {};
 }
}

function saveMemory(data){
 localStorage.setItem("susanKnowledge",JSON.stringify(data));
}

// ==================================
// 7. RESPONDER PREGUNTAS
// ==================================

function answer(input){
 const q=normalize(input);
 const memory=getMemory();

 // Respuestas enseñadas
 for(const key in memory){
  if(q===key){
   return memory[key];
  }
 }

 // Conocimientos programados
 if(knowledge[q]){
  return knowledge[q];
 }

 // Tabla periódica
 const elementMatch=q.match(/(?:elemento|simbolo|numero atomico|atomo)\s+(?:del|de la|de)?\s*(.+)/);
 if(elementMatch){
  const el=findElement(elementMatch[1]);
  if(el){
   return el.name+" ("+el.symbol+") tiene número atómico "+el.number+".";
  }
 }

 // Buscar elemento por nombre o símbolo
 const directElement=findElement(q);
 if(directElement){
  return directElement.name+" ("+directElement.symbol+") tiene número atómico "+directElement.number+".";
 }

 // Capitales
 if(q.startsWith("capital de ")){
  const key=q;
  if(knowledge[key])return knowledge[key];
 }

 // Matemáticas
 const mathMatch=q.match(/(?:cuanto es|calcula|resuelve)\s+(.+)/);
 if(mathMatch){
  const result=calculate(mathMatch[1]);
  if(result!==null)return "El resultado es "+result+".";
 }

 if(/^[0-9+\-*/().%\s^x÷,]+$/i.test(q) && /\d/.test(q)){
  const result=calculate(q);
  if(result!==null)return "El resultado es "+result+".";
 }

 // Respuestas generales
 if(q.includes("que es") || q.includes("quien fue") || q.includes("que significa")){
  return "Todavía no tengo esa información en mi base de conocimientos. Podés enseñármela con el botón ENSEÑAR.";
 }

 return "Todavía no conozco la respuesta a esa pregunta. Podés enseñármela con el botón ENSEÑAR y la guardaré para futuras consultas.";
}

// ==================================
// 8. CHAT
// ==================================

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function sendMessage(){
 const text=question.value.trim();
 if(!text)return;

 addMessage(text,"user");
 question.value="";

 const response=answer(text);
 lastAnswer=response;

 setTimeout(function(){
  addMessage(response,"bot");
 },250);
}

question.addEventListener("keydown",function(event){
 if(event.key==="Enter")sendMessage();
});

// ==================================
// 9. ENSEÑAR A SUSAN
// ==================================

function teach(){
 const newQuestion=prompt("¿Qué pregunta querés enseñarme?");
 if(!newQuestion || !newQuestion.trim())return;

 const newAnswer=prompt("¿Cuál es la respuesta correcta?");
 if(!newAnswer || !newAnswer.trim())return;

 const memory=getMemory();
 memory[normalize(newQuestion)]=newAnswer.trim();
 saveMemory(memory);

 addMessage("He aprendido una nueva respuesta: "+newQuestion,"user");
 addMessage("Información guardada correctamente. La recordaré en este navegador.","bot");
}

// ==================================
// 10. VOZ
// ==================================

function speakLast(){
 if(!lastAnswer){
  lastAnswer="No hay ninguna respuesta para leer.";
 }
 if(!("speechSynthesis" in window)){
  addMessage("La lectura por voz no está disponible en este navegador.","bot");
  return;
 }

 speechSynthesis.cancel();
 const speech=new SpeechSynthesisUtterance(lastAnswer);
 speech.lang="es-AR";
 speech.rate=1;
 speechSynthesis.speak(speech);
}

// ==================================
// 11. LIMPIAR CHAT
// ==================================

function clearChat(){
 chat.innerHTML="";
 addMessage("Conversación reiniciada. ¿En qué puedo ayudarte?","bot");
 lastAnswer="";
}
</script>
</body>
</html>
