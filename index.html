// =====================================
// 4. NORMALIZAR TEXTO
// =====================================
function normalize(text){
 return String(text)
  .toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[¿?¡!,.;:]/g,"")
  .replace(/\s+/g," ")
  .trim();
}
// =====================================
// 5. BUSCAR ELEMENTOS
// =====================================

function findElement(value){

 const q=normalize(value);

 for(let i=0;i<elements.length;i++){

  if(
   q===normalize(elements[i][0]) ||
   q===normalize(elements[i][1]) ||
   q===String(i+1)
  ){

   return {
    name:elements[i][0],
    symbol:elements[i][1],
    number:i+1
   };

  }
 }

 return null;
}

// =====================================
// 6. CALCULADORA
// =====================================

function calculate(expression){

 let exp=expression
 .replace(/x/gi,"*")
 .replace(/÷/g,"/")
 .replace(/,/g,".")
 .replace(/\^/g,"**");

 if(!/^[0-9+\-*/().%\s*]+$/.test(exp)){
  return null;
 }

 try{

  const result=Function(
   '"use strict";return ('+exp+')'
  )();

  if(typeof result!=="number" || !Number.isFinite(result)){
   return null;
  }

  return Number.isInteger(result)
   ?result
   :Number(result.toFixed(8));

 }catch(error){

  return null;

 }
}

function getMemory(){

 try{
  return JSON.parse(
   localStorage.getItem("susanKnowledge") || "{}"
  );
 }catch(error){

 }

}

function saveMemory(data){

 try{
  localStorage.setItem(
   "susanKnowledge",
   JSON.stringify(data)
  );
  return true;
 }catch(error){
  return false;
 }

}

// RELOJ MUNDIAL DE SUSAN

function worldClock(input){

 const q = normalize(input);

 if(!/hora|reloj|compar/.test(q)) return null;

 const cities = [
  {names:["argentina","buenos aires"], name:"Buenos Aires", zone:"America/Argentina/Buenos_Aires"},
  {names:["nueva york","new york","estados unidos","eeuu"], name:"Nueva York (EE. UU.)", zone:"America/New_York"},
  {names:["londres","inglaterra","reino unido"], name:"Londres", zone:"Europe/London"},
  {names:["espana","madrid"], name:"Madrid", zone:"Europe/Madrid"},
  {names:["japon","tokio"], name:"Tokio", zone:"Asia/Tokyo"},
  {names:["brasil","sao paulo"], name:"São Paulo", zone:"America/Sao_Paulo"}
 ];

 const found = cities.filter(city =>
  city.names.some(name => q.includes(name))
 );

 if(found.length === 0) return null;

 const results = found.map(city => {

  const time = new Intl.DateTimeFormat("es-AR", {
   timeZone: city.zone,
   hour: "2-digit",
   minute: "2-digit",
   hourCycle: "h23"
  }).format(new Date());

  return city.name + ": " + time;

 });

 return "🕒 HORARIO MUNDIAL\n\n" + results.join("\n");
}

function answer(input){

 const q=normalize(input);
 const memory=getMemory();

 // PERSONALIDAD DE SUSAN
 const jokes = [
  " Aunque debo admitir que esperaba una pregunta más difícil. 😏",
  " ¿Ves? Para eso estoy. Bueno, y para otras cosas también. 😂",
  " Un placer demostrar mis capacidades una vez más.",
  " No estuvo nada mal para una inteligencia artificial, ¿no?",
  " Siguiente misión, cuando quieras. 🚀"
 ];

 function addHumor(response){
  return response + jokes[Math.floor(Math.random()*jokes.length)];
 }

 // PSICOLOGÍA AVANZADA
 if(psychology[q]){
  return addHumor(psychology[q]);
 }

 // Memoria enseñada
 if(memory[q]){
  return memory[q];
 }

 // Conocimientos generales
 if(knowledge[q]){
  return addHumor(knowledge[q]);
 }

 // Elementos químicos
 const elementMatch=q.match(
  /(?:elemento|simbolo|numero atomico|atomo)\s+(?:del|de la|de)?\s*(.+)/
 );

 if(elementMatch){

  const el=findElement(elementMatch[1]);

  if(el){
   return addHumor(
    el.name+" ("+el.symbol+") tiene número atómico "+el.number+"."
   );
  }

 }

 const directElement=findElement(q);

 if(directElement){
  return addHumor(
   directElement.name+" ("+directElement.symbol+") tiene número atómico "+directElement.number+"."
  );
 }

 // Matemáticas
 const mathMatch=q.match(
  /(?:cuanto es|calcula|resuelve)\s+(.+)/
 );

 if(mathMatch){

  const result=calculate(mathMatch[1]);

  if(result!==null){
   return addHumor("El resultado es "+result+".");
  }

 }

 if(/^[0-9+\-*/().%\s^x÷,]+$/i.test(q) && /\d/.test(q)){

  const result=calculate(q);

  if(result!==null){
   return addHumor("El resultado es "+result+".");
  }

 }
// RELOJ MUNDIAL
const clockResponse = worldClock(q);

if(clockResponse){
 return clockResponse;
}
 return "Todavía no tengo esa respuesta en mi base de conocimientos. Pero no te preocupes, sigo aprendiendo. 😏 Podés enseñármela con el botón ENSEÑAR.";

}

// =====================================
// 9. MOSTRAR MENSAJES
// =====================================

function addMessage(text,type){

 const div = document.createElement("div");

 div.className = "message " + type;

 chat.appendChild(div);

 if(type === "bot"){

  let index = 0;

  const speed = 22;

  function write(){

   if(index < text.length){

    div.textContent += text.charAt(index);

    index++;

    chat.scrollTop = chat.scrollHeight;

    setTimeout(write,speed);

   }

  }

  write();

 } else {

  div.textContent = text;

 }

 chat.scrollTop = chat.scrollHeight;

}

function sendMessage(){

 const text = question.value.trim();

 if(!text) return;

 addMessage(text,"user");
 question.value = "";

 // INDICADOR DE PENSAMIENTO
 const thinking = document.createElement("div");
 thinking.className = "message bot thinking";
 thinking.id = "thinking";
 thinking.innerHTML = "SUSAN está procesando<span class='dots'>...</span>";

 document.getElementById("chat").appendChild(thinking);

 function finishThinking(response){

  setTimeout(function(){

   const indicator = document.getElementById("thinking");

   if(indicator) indicator.remove();

   lastAnswer = response;
   addMessage(response,"bot");
   speakLast();

  },900);

 }

 // SPOTIFY
 const spotifyMatch = text.match(
  /(?:reproduce|reproducí|reproducir|pon[eé]|pone|escucha|escuchá)\s+(?:desde|en)\s+spotify\s+(.+)/i
 );

 if(spotifyMatch){

  const song = spotifyMatch[1].trim();
  const response = "Abriendo Spotify para buscar: " + song;

  finishThinking(response);

  const url = "spotify:search:" + encodeURIComponent(song);

  setTimeout(function(){
   window.location.href = url;
  },1200);

  return;
 }

 // WHATSAPP
 const whatsappMatch = text.match(
  /(?:mandale|enviale|escribile|escribele)\s+a\s+(.+?)\s+que\s+(.+)/i
 );

 if(whatsappMatch){

  const contact = whatsappMatch[1].trim();
  const message = whatsappMatch[2].trim();

  const response =
   "Preparé el mensaje para " + contact +
   ". Ahora elegí WhatsApp y después el contacto.";

  finishThinking(response);

  if(navigator.share){

   navigator.share({
    title: "Mensaje para " + contact,
    text: message
   }).catch(error => {
    if(error.name !== "AbortError"){
     addMessage("No pude abrir el menú para compartir.", "bot");
    }
   });

  } else {

   addMessage(
    "Tu navegador no permite abrir el menú para compartir.",
    "bot"
   );

  }

  return;
 }

 // RESPUESTA NORMAL
 const response = answer(text);

 finishThinking(response);

}

function teach(){

 const newQuestion=prompt(
  "¿Qué pregunta querés enseñarme?"
 );

 if(!newQuestion || !newQuestion.trim())return;

 const newAnswer=prompt(
  "¿Cuál es la respuesta correcta?"
 );

 if(!newAnswer || !newAnswer.trim())return;

 const memory=getMemory();

 memory[normalize(newQuestion)]=newAnswer.trim();

 if(saveMemory(memory)){

  addMessage(
   "Nueva pregunta: "+newQuestion,
   "user"
  );

  addMessage(
   "¡Aprendido! Guardé esa respuesta.",
   "bot"
  );

 }else{

  addMessage(
   "No pude guardar la información en este navegador.",
   "bot"
  );

 }

}

// =====================================
// 12. VOZ
// =====================================

function speakLast(){

 if(!lastAnswer) return;

 if(!("speechSynthesis" in window)){
  addMessage("La lectura por voz no está disponible.","bot");
  return;
 }

 speechSynthesis.cancel();

 const speech = new SpeechSynthesisUtterance(lastAnswer);

 speech.lang = "es-AR";
 speech.rate = 0.90;
 speech.pitch = 1.05;
 speech.volume = 1;

 const voices = speechSynthesis.getVoices();

 const spanishVoices = voices.filter(voice =>
  voice.lang.toLowerCase().startsWith("es")
 );

 const femaleVoice = spanishVoices.find(voice =>
  /female|mujer|monica|paulina|helena|sabina/i.test(voice.name)
 );

 const selectedVoice = femaleVoice || spanishVoices.find(voice =>
  voice.lang.toLowerCase() === "es-ar"
 ) || spanishVoices[0];

 if(selectedVoice){
  speech.voice = selectedVoice;
 }

 speechSynthesis.speak(speech);

}

// 14. CONECTAR BOTONES
// =====================================
// RECONOCIMIENTO DE VOZ
function startListening(){

 const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  addMessage(
   "Tu navegador no admite reconocimiento de voz.",
   "bot"
  );
  return;
 }

 const recognition = new SpeechRecognition();

 recognition.lang = "es-AR";
 recognition.continuous = false;
 recognition.interimResults = false;

 addMessage("Te escucho...", "bot");

 recognition.onresult = function(event){

  const transcript =
   event.results[0][0].transcript;

  question.value = transcript;

  sendMessage();

 };

 recognition.onerror = function(){

  addMessage(
   "No pude entenderte. Intentá nuevamente.",
   "bot"
  );

 };

 recognition.onend = function(){
  console.log("Reconocimiento finalizado");
 };

 try{
  recognition.start();
 }catch(error){
  addMessage("No pude iniciar el micrófono.", "bot");
 }

}

// MOVIMIENTO TÁCTIL DE SUSAN

const susanPet = document.getElementById("susanPet");

let movingSusan = false;
let movedSusan = false;
let startX = 0;
let startY = 0;

susanPet.addEventListener("touchstart", function(e){

 e.preventDefault();

 movingSusan = true;
 movedSusan = false;

 startX = e.touches[0].clientX;
 startY = e.touches[0].clientY;

}, { passive: false });

susanPet.addEventListener("touchmove", function(e){

 if(!movingSusan) return;

 e.preventDefault();

 const touch = e.touches[0];

 const dx = touch.clientX - startX;
 const dy = touch.clientY - startY;

 if(Math.abs(dx) > 3 || Math.abs(dy) > 3){
  movedSusan = true;
 }

 if(movedSusan){

  const rect = susanPet.getBoundingClientRect();

  let left = Math.max(0, Math.min(
   rect.left + dx,
   window.innerWidth - rect.width
  ));

  let top = Math.max(0, Math.min(
   rect.top + dy,
   window.innerHeight - rect.height
  ));

  susanPet.style.left = left + "px";
  susanPet.style.top = top + "px";
  susanPet.style.right = "auto";
  susanPet.style.bottom = "auto";

  startX = touch.clientX;
  startY = touch.clientY;
 }

}, { passive: false });

susanPet.addEventListener("touchend", function(){

 movingSusan = false;

 if(!movedSusan){
  document.getElementById("chat").scrollIntoView({
   behavior: "smooth",
   block: "center"
  });

  question.focus();
 }

});

susanPet.addEventListener("touchcancel", function(){
 movingSusan = false;
});
</script>
