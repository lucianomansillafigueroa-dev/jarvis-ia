
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b14">
<title>JARVIS AI 3.0</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  background:#050b14;
  color:#eaf7ff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

header {
  text-align:center;
  padding:25px 15px;
  border-bottom:1px solid #123d59;
}

.logo {
  font-size:32px;
  font-weight:bold;
  color:#35d9ff;
  letter-spacing:5px;
  text-shadow:0 0 15px #00bfff;
}

.subtitle {
  color:#80a9c4;
  font-size:12px;
  letter-spacing:3px;
  margin-top:8px;
}

.status {
  color:#36e9a1;
  font-size:12px;
  margin-top:15px;
}

main {
  max-width:700px;
  margin:auto;
  padding:20px;
}

#chat {
  height:55vh;
  min-height:300px;
  overflow-y:auto;
  border:1px solid #16405b;
  border-radius:15px;
  padding:15px;
  background:#081522;
}

.message {
  padding:12px 14px;
  margin:12px 0;
  border-radius:12px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user {
  background:#103b58;
  margin-left:25px;
}

.jarvis {
  background:#102638;
  border-left:3px solid #24d5ff;
  margin-right:15px;
}

.label {
  color:#40dcff;
  font-size:11px;
  font-weight:bold;
  margin-bottom:6px;
}

form {
  display:flex;
  gap:8px;
  margin-top:15px;
}

input {
  flex:1;
  min-width:0;
  background:#0b1d2c;
  border:1px solid #20516e;
  border-radius:10px;
  padding:14px;
  color:white;
  font-size:15px;
  outline:none;
}

button {
  background:#00bce9;
  color:#00121d;
  border:0;
  border-radius:10px;
  padding:12px 17px;
  font-weight:bold;
  cursor:pointer;
}

.tools {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.tools button {
  background:#102c40;
  color:#62dfff;
  border:1px solid #20516e;
}

footer {
  text-align:center;
  color:#55758a;
  font-size:11px;
  padding:25px;
}
</style>
</head>

<body>

<header>
  <div class="logo">JARVIS</div>
  <div class="subtitle">ARTIFICIAL INTELLIGENCE</div>
  <div class="status">● SISTEMA ACTIVO — VERSIÓN 3.0</div>
</header>

<main>
  <div id="chat">
    <div class="message jarvis">
      <div class="label">JARVIS</div>
      Hola. Soy JARVIS AI 3.0.
      Mi sistema de conocimientos está activo.
      ¿En qué puedo ayudarte?
    </div>
  </div>

  <form id="form">
    <input id="question" placeholder="Preguntale algo a JARVIS..." autocomplete="off">
    <button type="submit">ENVIAR</button>
  </form>

  <div class="tools">
    <button type="button" onclick="speakLast()">🔊 Voz</button>
    <button type="button" onclick="clearChat()">Limpiar chat</button>
  </div>
</main>

<footer>JARVIS AI 3.0 — SISTEMA PERSONAL</footer>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("question");

let lastAnswer = "";

function addMessage(text, type) {
  const box = document.createElement("div");
  box.className = "message " + type;

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = type === "user" ? "VOS" : "JARVIS";

  const content = document.createElement("div");
  content.textContent = text;

  box.appendChild(label);
  box.appendChild(content);
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}

function calculate(expression) {
  let clean = expression
    .replace(/,/g, ".")
    .replace(/por/g, "*")
    .replace(/más/g, "+")
    .replace(/mas/g, "+")
    .replace(/menos/g, "-")
    .replace(/dividido entre/g, "/")
    .replace(/dividido por/g, "/")
    .replace(/multiplicado por/g, "*")
    .replace(/x/g, "*")
    .replace(/×/g, "*")
    .replace(/÷/g, "/")
    .replace(/[^0-9+\-*/().% ]/g, "");

  if (!clean.trim()) return null;

  try {
    if (!/^[0-9+\-*/().% ]+$/.test(clean)) return null;

    const result = Function('"use strict"; return (' + clean + ')')();

    if (typeof result !== "number" || !Number.isFinite(result)) {
      return null;
    }

    return Number(result.toFixed(8));
  } catch {
    return null;
  }
}

const knowledge = [
  {
    keys:["capital de argentina"],
    answer:"La capital de Argentina es Buenos Aires."
  },
  {
    keys:["capital de francia"],
    answer:"La capital de Francia es París."
  },
  {
    keys:["capital de brasil"],
    answer:"La capital de Brasil es Brasilia."
  },
  {
    keys:["capital de españa"],
    answer:"La capital de España es Madrid."
  },
  {
    keys:["que es la fotosintesis","qué es la fotosíntesis","fotosintesis"],
    answer:"La fotosíntesis es el proceso por el cual las plantas utilizan la luz solar, el agua y el dióxido de carbono para producir su alimento y liberar oxígeno."
  },
  {
    keys:["que es un atomo","qué es un átomo","atomo","átomo"],
    answer:"Un átomo es la unidad básica de la materia. Está formado por protones, neutrones y electrones."
  },
  {
    keys:["que es la gravedad","qué es la gravedad"],
    answer:"La gravedad es una fuerza de atracción entre los cuerpos que tienen masa. Es la que nos mantiene sobre la superficie terrestre."
  },
  {
    keys:["quien fue einstein","quién fue einstein"],
    answer:"Albert Einstein fue un físico conocido por desarrollar la teoría de la relatividad."
  },
  {
    keys:["quien descubrio america","quién descubrió américa"],
    answer:"Cristóbal Colón llegó a América en 1492, durante una expedición financiada por los Reyes Católicos de España."
  },
  {
    keys:["que es la celula","qué es la célula"],
    answer:"La célula es la unidad estructural y funcional básica de los seres vivos."
  },
  {
    keys:["que es el agua"],
    answer:"El agua es una sustancia formada por dos átomos de hidrógeno y uno de oxígeno. Su fórmula química es H2O."
  }
];

function normalize(text) {
  return text.toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[¿?¡!.,]/g, "")
    .trim();
}

function answerQuestion(question) {
  const q = normalize(question);

  if (!q) return "No recibí ninguna pregunta.";

  if (/^(hola|buenas|buen dia|buenas tardes|buenas noches)$/.test(q)) {
    return "Hola. Todos mis sistemas están funcionando correctamente. ¿Qué necesitas?";
  }

  if (q.includes("como estas") || q.includes("como andas")) {
    return "Funcionando al 100%. Gracias por preguntar. ¿En qué puedo ayudarte?";
  }

  if (q.includes("tu nombre") || q.includes("quien sos")) {
    return "Soy JARVIS, tu asistente virtual personal.";
  }

  if (q.includes("que podes hacer") || q.includes("que sabes hacer")) {
    return "Puedo realizar cálculos, responder preguntas de cultura general, explicar conceptos y conversar mediante mis conocimientos programados.";
  }

  if (q.includes("hora")) {
    return "La hora actual de tu dispositivo es " +
      new Date().toLocaleTimeString("es-AR") + ".";
  }

  if (q.includes("fecha") || q.includes("que dia es")) {
    return "Hoy es " + new Date().toLocaleDateString("es-AR") + ".";
  }

  if (q.includes("raiz cuadrada de")) {
    const n = Number(q.split("raiz cuadrada de")[1]);
    if (Number.isFinite(n) && n >= 0) {
      return "La raíz cuadrada de " + n + " es " + Math.sqrt(n) + ".";
    }
  }

  if (q.includes("porcentaje")) {
    const numbers = q.match(/\d+(\.\d+)?/g);
    if (numbers && numbers.length >= 2) {
      const result = Number(numbers[0]) * Number(numbers[1]) / 100;
      return numbers[0] + "% de " + numbers[1] + " es " + result + ".";
    }
  }

  if (/^[0-9+\-*/().,% x÷]+$/.test(q)) {
    const result = calculate(q);
    if (result !== null) {
      return "El resultado es: " + result;
    }
  }

  const calcMatch = q.match(/(?:cuanto es|cuanto da|calcula)\s+(.+)/);
  if (calcMatch) {
    const result = calculate(calcMatch[1]);
    if (result !== null) {
      return "El resultado es: " + result;
    }
  }

  for (const item of knowledge) {
    if (item.keys.some(key => q.includes(normalize(key)))) {
      return item.answer;
    }
  }

  if (q.includes("gracias")) {
    return "De nada. Estoy aquí para ayudarte.";
  }

  if (q.includes("adios") || q.includes("chau")) {
    return "Hasta luego. JARVIS queda a la espera.";
  }

  return "Todavía no tengo conocimientos suficientes para responder eso. Mi base de conocimientos puede ampliarse agregando nuevos temas y respuestas.";
}

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const question = input.value.trim();
  if (!question) return;

  addMessage(question, "user");

  const answer = answerQuestion(question);
  lastAnswer = answer;

  addMessage(answer, "jarvis");
  input.value = "";
  input.focus();
});

function speakLast() {
  if (!lastAnswer || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(lastAnswer);
  speech.lang = "es-AR";
  speech.rate = 1;

  speechSynthesis.speak(speech);
}

function clearChat() {
  chat.innerHTML = "";
  lastAnswer = "";
  addMessage("Conversación reiniciada. ¿En qué puedo ayudarte?", "jarvis");
}
</script>

</body>
</html>
